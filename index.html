<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Assessment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="todo-container">
        <header>
            <h1>To-Do List</h1>
        </header>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="What needs to be done?" aria-label="New task content">
            <button id="add-btn" aria-label="Add new task">Add</button>
        </div>
        <p id="error-msg" class="error-message" aria-live="polite"></p>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list">
            </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
